version: '3.8'

services:

  # ===================== #
  # ZOOKEEPER
  # ===================== #
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - spark-kafka-net

  # ===================== #
  # KAFKA
  # ===================== #
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - spark-kafka-net

  # ===================== #
  # SPARK + JUPYTER
  # ===================== #
  spark-jupyter:
    image: mohamedamineellouze001/spark_scala_jupyter:v2
    container_name: spark-jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./workspace:/workspace
    environment:
      - JUPYTER_PORT=8888
    working_dir: /workspace
    networks:
      - spark-kafka-net
    depends_on:
      - kafka
      - mongo

  # ===================== #
  # MONGO
  # ===================== #
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
    volumes:
      - ./database/db:/data/db
    networks:
      - spark-kafka-net

  # ===================== #
  # MONGO-EXPRESS
  # ===================== #
  mongo_admin:
    image: mongo-express
    container_name: mongoadmin
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_URL: mongodb://root:pass@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: mexpress
      ME_CONFIG_BASICAUTH_PASSWORD: mexpress
    networks:
      - spark-kafka-net

  # ===================== #
  # KAFKA PRODUCER
  # ===================== #
  producer:
    image: python:3.11-slim
    container_name: producer
    depends_on:
      - kafka
    working_dir: /app
    volumes:
      - "./Ecommerce data generator:/app"
    command: sh -c "pip install --no-cache-dir confluent-kafka faker numpy && python3 producer.py"
    networks:
      - spark-kafka-net

networks:
  spark-kafka-net:
    driver: bridge
